<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Post</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#5B7A6D">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg: #FAFAF8;
    --ink: #181816;
    --secondary: #736D63;
    --line: #EDEAE4;
    --accent: #5B7A6D;
    --accent-dim: #eef2f0;
    --error: #B3492F;
    --error-dim: #fbeeea;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .frame {
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px 10px 20px;
  }

  .topbar button {
    font-size: 16px;
    color: var(--secondary);
    background: none;
    border: none;
    padding: 0;
    font-family: inherit;
  }

  .topbar .eyebrow {
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--secondary);
    font-weight: 600;
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    color: var(--secondary);
  }

  .content {
    flex: 1;
    padding: 4px 20px 0 20px;
  }

  .field {
    width: 100%;
    background: #F2EFE9;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    color: var(--ink);
    font-family: inherit;
    outline: none;
  }
  .field::placeholder { color: var(--secondary); }

  .title-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: 6px 0 16px 0;
  }

  .title-input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    color: var(--ink);
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.3;
    padding: 4px 0;
    font-family: inherit;
    outline: none;
  }

  .date-input {
    flex-shrink: 0;
    align-self: center;
    margin-top: 6px;
    background: #F2EFE9;
    border: none;
    border-radius: 999px;
    padding: 9px 14px;
    color: var(--secondary);
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }

  .divider {
    border: none;
    border-top: 1px solid var(--line);
    margin: 0;
  }

  .body-input {
    width: 100%;
    min-height: 140px;
    background: transparent;
    border: none;
    color: var(--ink);
    font-size: 16px;
    line-height: 1.6;
    padding: 20px 0;
    font-family: inherit;
    outline: none;
    resize: none;
  }

  .title-input::placeholder,
  .body-input::placeholder { color: var(--secondary); }

  .photo-add {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 20px 0;
    cursor: pointer;
  }
  .photo-add input[type="file"] { display: none; }

  .photo-add-icon {
    width: 56px;
    height: 56px;
    flex-shrink: 0;
    border: 1.5px dashed var(--line);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--secondary);
  }

  .photo-add-label {
    color: var(--secondary);
    font-size: 16px;
  }

  .photo-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding-bottom: 8px;
  }

  .photo-tile {
    position: relative;
    aspect-ratio: 1;
    border-radius: 10px;
    background: #EFECE6;
    overflow: hidden;
    touch-action: none;
  }
  .photo-tile img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }

  .photo-tile .remove {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: rgba(24,24,22,0.65);
    color: #fff;
    font-size: 13px;
    line-height: 20px;
    text-align: center;
    border: none;
    padding: 0;
  }

  .photo-tile.dragging-placeholder { opacity: 0.35; }

  .photo-tile-ghost {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 100;
    pointer-events: none;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(24,24,22,0.25);
    transform: scale(1.05);
  }
  .photo-tile-ghost img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .footer {
    padding: 12px 20px 20px 20px;
  }

  .btn-primary {
    width: 100%;
    padding: 18px 0;
    border-radius: 18px;
    background: var(--accent);
    color: #FFFFFF;
    font-size: 16px;
    font-weight: 600;
    border: none;
    font-family: inherit;
  }
  .btn-primary:active { opacity: 0.85; }
  .btn-primary:disabled { opacity: 0.5; }

  .status-banner {
    display: none;
    font-size: 13px;
    line-height: 1.5;
    padding: 12px 14px;
    border-radius: 10px;
    margin-bottom: 12px;
  }
  .status-banner.show { display: block; }
  .status-banner.info { background: var(--accent-dim); color: var(--accent); }
  .status-banner.error { background: var(--error-dim); color: var(--error); }
  .status-banner a { color: inherit; font-weight: 600; }

  ::selection { background: var(--accent-dim); }

  /* Settings overlay */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 10;
  }
  .overlay.show { display: block; }

  .overlay-body {
    padding: 0 20px 24px 20px;
  }

  .field-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--secondary);
    margin: 20px 0 8px 0;
  }
  .field-label:first-child { margin-top: 0; }

  .help-text {
    font-size: 12px;
    color: var(--secondary);
    line-height: 1.5;
    margin-top: 24px;
  }

  .overlay-body .btn-primary { margin-top: 28px; }
</style>
</head>
<body>

<div class="frame">

  <div class="topbar">
    <span class="eyebrow">New Post</span>
    <button class="icon-btn" id="openSettings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </div>

  <div class="content">

    <div class="title-row">
      <input class="title-input" id="titleInput" placeholder="Post title">

      <input type="date" class="date-input" id="dateInput">
    </div>

    <hr class="divider">

    <textarea class="body-input" id="bodyInput" placeholder="Start writing..."></textarea>

    <hr class="divider">

    <label class="photo-add">
      <span class="photo-add-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
      </span>
      <span class="photo-add-label">Add photos to your post</span>
      <input type="file" id="photoInput" accept="image/*" multiple>
    </label>
    <div class="photo-grid" id="photoGrid"></div>

  </div>

  <div class="footer">
    <div id="statusBanner" class="status-banner"></div>
    <button class="btn-primary" id="publishBtn">Publish</button>
  </div>

</div>

<!-- Settings overlay -->
<div class="overlay" id="settingsOverlay">
  <div class="frame">
    <div class="topbar">
      <span class="eyebrow">Settings</span>
      <button class="icon-btn" id="closeSettings" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="overlay-body">
      <div class="field-label">Site URL</div>
      <input class="field" id="siteUrlInput" placeholder="https://yoursite.com" autocapitalize="off" autocorrect="off">

      <div class="field-label">Username</div>
      <input class="field" id="usernameInput" placeholder="your WordPress username" autocapitalize="off" autocorrect="off">

      <div class="field-label">Application Password</div>
      <input class="field" id="appPasswordInput" placeholder="xxxx xxxx xxxx xxxx xxxx xxxx" autocapitalize="off" autocorrect="off">

      <div class="help-text">
        Generate this under Users → Profile → Application Passwords in your WordPress admin. Stored only on this device, in this browser.
      </div>

      <button class="btn-primary" id="saveSettings">Save</button>
    </div>
  </div>
</div>

<script>
(function () {
  const STORAGE_KEY = 'wpPosterSettings';

  const els = {
    title: document.getElementById('titleInput'),
    date: document.getElementById('dateInput'),
    body: document.getElementById('bodyInput'),
    photoGrid: document.getElementById('photoGrid'),
    photoInput: document.getElementById('photoInput'),
    publishBtn: document.getElementById('publishBtn'),
    statusBanner: document.getElementById('statusBanner'),
    openSettings: document.getElementById('openSettings'),
    closeSettings: document.getElementById('closeSettings'),
    settingsOverlay: document.getElementById('settingsOverlay'),
    siteUrl: document.getElementById('siteUrlInput'),
    username: document.getElementById('usernameInput'),
    appPassword: document.getElementById('appPasswordInput'),
    saveSettings: document.getElementById('saveSettings'),
  };

  let photos = []; // { file, url }

  function loadSettings() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function saveSettingsToStorage(settings) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
  }

  function getSettings() {
    return loadSettings() || { siteUrl: '', username: '', appPassword: '' };
  }

  function openSettingsPanel() {
    const s = getSettings();
    els.siteUrl.value = s.siteUrl || '';
    els.username.value = s.username || '';
    els.appPassword.value = s.appPassword || '';
    els.settingsOverlay.classList.add('show');
  }

  function closeSettingsPanel() {
    els.settingsOverlay.classList.remove('show');
  }

  els.openSettings.addEventListener('click', openSettingsPanel);
  els.closeSettings.addEventListener('click', closeSettingsPanel);

  els.saveSettings.addEventListener('click', function () {
    const settings = {
      siteUrl: els.siteUrl.value.trim().replace(/\/$/, ''),
      username: els.username.value.trim(),
      appPassword: els.appPassword.value.trim(),
    };
    saveSettingsToStorage(settings);
    closeSettingsPanel();
  });

  // Default date to today
  function toDateInputValue(d) {
    const pad = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  els.date.value = toDateInputValue(new Date());

  // Photo handling
  function renderPhotos() {
    els.photoGrid.innerHTML = '';
    photos.forEach((p) => {
      const tile = document.createElement('div');
      tile.className = 'photo-tile';
      tile.photoRef = p;
      const img = document.createElement('img');
      img.src = p.url;
      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove';
      removeBtn.textContent = '×';
      removeBtn.addEventListener('click', function (e) {
        e.preventDefault();
        URL.revokeObjectURL(p.url);
        photos = photos.filter(x => x !== p);
        renderPhotos();
      });
      tile.appendChild(img);
      tile.appendChild(removeBtn);
      makeDraggable(tile, p);
      els.photoGrid.appendChild(tile);
    });
  }

  // Drag-to-reorder for photo tiles. Uses Pointer Events (not the HTML5
  // Drag and Drop API, which iOS Safari doesn't support for touch) — a
  // floating ghost follows the finger/pointer while the real tile is moved
  // live via insertBefore so the CSS grid reflows the other tiles naturally.
  let dragState = null;

  function makeDraggable(tile, photo) {
    tile.addEventListener('pointerdown', function (e) {
      if (e.target.closest('.remove')) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      const rect = tile.getBoundingClientRect();
      dragState = {
        tile: tile,
        pointerId: e.pointerId,
        offsetX: e.clientX - rect.left,
        offsetY: e.clientY - rect.top,
        width: rect.width,
        height: rect.height,
        startX: e.clientX,
        startY: e.clientY,
        moved: false,
        ghost: null,
      };
    });
  }

  function positionGhost(x, y) {
    dragState.ghost.style.left = (x - dragState.offsetX) + 'px';
    dragState.ghost.style.top = (y - dragState.offsetY) + 'px';
  }

  function startDrag(photo, x, y) {
    const ghost = document.createElement('div');
    ghost.className = 'photo-tile-ghost';
    ghost.style.width = dragState.width + 'px';
    ghost.style.height = dragState.height + 'px';
    const img = document.createElement('img');
    img.src = photo.url;
    ghost.appendChild(img);
    document.body.appendChild(ghost);
    dragState.ghost = ghost;
    dragState.tile.classList.add('dragging-placeholder');
    positionGhost(x, y);
  }

  function tileUnderPoint(x, y, excludeTile) {
    const tiles = Array.from(els.photoGrid.querySelectorAll('.photo-tile'));
    for (const t of tiles) {
      if (t === excludeTile) continue;
      const r = t.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return t;
    }
    return null;
  }

  document.addEventListener('pointermove', function (e) {
    if (!dragState || e.pointerId !== dragState.pointerId) return;

    if (!dragState.moved) {
      const dx = e.clientX - dragState.startX;
      const dy = e.clientY - dragState.startY;
      if (Math.hypot(dx, dy) < 6) return;
      dragState.moved = true;
      dragState.tile.setPointerCapture(dragState.pointerId);
      startDrag(dragState.tile.photoRef, e.clientX, e.clientY);
    }

    e.preventDefault();
    positionGhost(e.clientX, e.clientY);

    const target = tileUnderPoint(e.clientX, e.clientY, dragState.tile);
    if (target) {
      const tiles = Array.from(els.photoGrid.children);
      const dragIdx = tiles.indexOf(dragState.tile);
      const targetIdx = tiles.indexOf(target);
      if (dragIdx < targetIdx) {
        els.photoGrid.insertBefore(dragState.tile, target.nextSibling);
      } else {
        els.photoGrid.insertBefore(dragState.tile, target);
      }
    }
  }, { passive: false });

  function endDrag(e) {
    if (!dragState) return;
    if (dragState.moved) {
      dragState.tile.releasePointerCapture(dragState.pointerId);
      dragState.tile.classList.remove('dragging-placeholder');
      dragState.ghost.remove();
      photos = Array.from(els.photoGrid.querySelectorAll('.photo-tile')).map(t => t.photoRef);
    }
    dragState = null;
  }

  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);

  els.photoInput.addEventListener('change', function (e) {
    const files = Array.from(e.target.files || []);
    files.forEach(file => {
      photos.push({ file: file, url: URL.createObjectURL(file) });
    });
    renderPhotos();
    e.target.value = '';
  });

  function showStatus(message, type, html) {
    els.statusBanner.className = 'status-banner show ' + type;
    if (html) {
      els.statusBanner.innerHTML = message;
    } else {
      els.statusBanner.textContent = message;
    }
  }

  function resetForm() {
    els.title.value = '';
    els.body.value = '';
    photos.forEach(p => URL.revokeObjectURL(p.url));
    photos = [];
    renderPhotos();
    els.date.value = toDateInputValue(new Date());
  }

  function authHeader(settings) {
    const token = btoa(settings.username + ':' + settings.appPassword.replace(/\s+/g, ''));
    return 'Basic ' + token;
  }

  // WordPress usually returns JSON on failure, but a hard server-side fatal
  // (PHP timeout, memory exhausted, etc.) often returns WordPress's own
  // "critical error" HTML page instead — strip it down to visible text
  // rather than dumping raw markup, since the actual message is buried
  // after a large <style> block that would otherwise eat the whole preview.
  async function errorDetail(res) {
    const text = await res.text();
    try {
      const j = JSON.parse(text);
      return j.message || text.slice(0, 300);
    } catch (e) {
      const stripped = text
        .replace(/<style[\s\S]*?<\/style>/gi, ' ')
        .replace(/<script[\s\S]*?<\/script>/gi, ' ')
        .replace(/<[^>]+>/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      return stripped.slice(0, 400) || '(no response body)';
    }
  }

  // HTTP header values only allow a narrow ASCII range — a filename with
  // emoji, accented characters, or anything else outside that (common from
  // Photos/Messages/AirDrop-sourced files) makes Safari's fetch() reject the
  // whole request with "The string did not match the expected pattern"
  // before it's even sent, rather than a normal upload failure.
  function safeFilename(name) {
    const cleaned = name.replace(/[^\x20-\x7E]/g, '').replace(/["\\]/g, '').trim();
    return cleaned || 'photo.jpg';
  }

  async function uploadPhoto(settings, file, index, total) {
    showStatus('Uploading photo ' + (index + 1) + ' of ' + total + '…', 'info');
    const res = await fetch(settings.siteUrl + '/wp-json/wp/v2/media', {
      method: 'POST',
      headers: {
        'Authorization': authHeader(settings),
        'Content-Disposition': 'attachment; filename="' + safeFilename(file.name) + '"',
        'Content-Type': file.type || 'application/octet-stream',
      },
      body: file,
    });
    if (!res.ok) {
      throw new Error('Photo upload failed (' + res.status + '). ' + await errorDetail(res));
    }
    const json = await res.json();
    return json.id;
  }

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Wrap body text and the gallery shortcode as real Gutenberg blocks so the
  // post opens as editable blocks instead of one raw "Classic" text blob.
  function buildParagraphBlocks(text) {
    return text.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean).map(p =>
      '<!-- wp:paragraph -->\n<p>' + escapeHtml(p).replace(/\n/g, '<br>') + '</p>\n<!-- /wp:paragraph -->'
    ).join('\n\n');
  }

  function buildGalleryShortcodeBlock(mediaIds) {
    return '<!-- wp:shortcode -->\n[gallery ids="' + mediaIds.join(',') + '"]\n<!-- /wp:shortcode -->';
  }

  async function createPost(settings, mediaIds) {
    showStatus('Publishing post…', 'info');

    const bodyText = els.body.value.trim();
    const parts = [];
    if (bodyText) parts.push(buildParagraphBlocks(bodyText));
    if (mediaIds.length) parts.push(buildGalleryShortcodeBlock(mediaIds));
    const content = parts.join('\n\n');

    // The date picker only collects a calendar date (no time-of-day UI), so
    // stamp it with the current time and convert to UTC ourselves — relying
    // on the WordPress site's configured timezone to match the phone's isn't
    // safe otherwise.
    const [y, m, d] = els.date.value.split('-').map(Number);
    const now = new Date();
    const localDateTime = new Date(y, m - 1, d, now.getHours(), now.getMinutes(), now.getSeconds());
    const dateGmt = localDateTime.toISOString().slice(0, 19);

    const res = await fetch(settings.siteUrl + '/wp-json/wp/v2/posts', {
      method: 'POST',
      headers: {
        'Authorization': authHeader(settings),
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        title: els.title.value.trim() || '(Untitled)',
        content: content,
        date_gmt: dateGmt,
        status: 'publish',
      }),
    });

    if (!res.ok) {
      throw new Error('Publishing failed (' + res.status + '). ' + await errorDetail(res));
    }

    return res.json();
  }

  els.publishBtn.addEventListener('click', async function () {
    const settings = getSettings();

    if (!settings.siteUrl || !settings.username || !settings.appPassword) {
      showStatus('Add your URL, username, and application password in Settings first.', 'error');
      openSettingsPanel();
      return;
    }

    if (!/^https:\/\//i.test(settings.siteUrl)) {
      showStatus('Site URL must start with https:// so your password isn\'t sent in plain text.', 'error');
      openSettingsPanel();
      return;
    }

    if (!els.title.value.trim() && !els.body.value.trim() && photos.length === 0) {
      showStatus('Nothing to publish yet.', 'error');
      return;
    }

    els.publishBtn.disabled = true;

    try {
      for (let i = 0; i < photos.length; i++) {
        if (photos[i].mediaId == null) {
          photos[i].mediaId = await uploadPhoto(settings, photos[i].file, i, photos.length);
        }
      }
      const mediaIds = photos.map(p => p.mediaId);

      const post = await createPost(settings, mediaIds);

      showStatus(
        'Published — <a href="' + post.link + '" target="_blank" rel="noopener">view post</a>',
        'info',
        true
      );
      resetForm();
    } catch (err) {
      let msg = err.message || 'Something went wrong.';
      if (err instanceof TypeError) {
        msg = 'Could not reach your site. This is usually a CORS setting on your WordPress site — see setup notes.';
      }
      showStatus(msg, 'error');
    } finally {
      els.publishBtn.disabled = false;
    }
  });
})();
